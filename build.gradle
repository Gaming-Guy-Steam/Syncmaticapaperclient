plugins {
    id 'fabric-loom' version '1.6.11'
}

group = 'com.example.syncmatica'
version = '0.1.0'

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://cursemaven.com' }       // CurseForge Maven
    maven { url = "https://api.modrinth.com/maven" } // Modrinth Maven
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.10"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.15.11"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.100.4+1.21"
    modImplementation "maven.modrinth:malilib:0.26.6"
    modImplementation "maven.modrinth:litematica:0.16.0"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}
